<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotionKit widget</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:6px;perspective:1200px}
.card{position:relative;width:100%;aspect-ratio:360/556;max-height:100%;border-radius:16px;cursor:pointer;user-select:none;transform-style:preserve-3d;box-shadow:0 12px 30px rgba(0,0,0,.2);transition:transform .6s cubic-bezier(.4,0,.2,1)}
.face{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:16px;overflow:hidden;background:#fff;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face img{position:absolute;top:0;left:0;width:100%;height:100%}
.e-hover .f-back{z-index:1}.e-hover .f-front{z-index:2;transition:opacity .32s}
.e-hover:hover .f-front,.e-hover.on .f-front{opacity:0}
.e-flip{box-shadow:none}
.flip-inner{position:absolute;top:0;left:0;width:100%;height:100%;transform-style:preserve-3d;transition:transform .72s cubic-bezier(.2,.9,.25,1)}
.e-flip .f-front{z-index:2}.e-flip .f-back{z-index:1;transform:rotateY(180deg)}
.e-flip:hover .flip-inner,.e-flip.on .flip-inner{transform:rotateY(180deg)}
.sh-rest,.sh-hover{position:absolute;left:9%;right:9%;bottom:-3.5%;height:7%;border-radius:50%;filter:blur(7px);transition:opacity .5s,transform .5s;pointer-events:none}
.sh-rest{background:rgba(0,0,0,.3);opacity:1}
.sh-hover{background:rgba(0,0,0,.34);opacity:0;transform:translateY(7px) scale(1.09)}
.e-flip:hover .sh-rest,.e-flip.on .sh-rest{opacity:0}
.e-flip:hover .sh-hover,.e-flip.on .sh-hover{opacity:1}
.e-flip .face{box-shadow:0 10px 22px rgba(0,0,0,.16);transition:box-shadow .5s}
.e-flip:hover .face,.e-flip.on .face{box-shadow:0 20px 40px rgba(0,0,0,.26)}
.fshine{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:16px;pointer-events:none;opacity:0;background:linear-gradient(103deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.72) 50%,rgba(255,255,255,0) 62%)}
.e-flip:hover .fshine,.e-flip.on .fshine{animation:fsh .8s .36s ease-out 1}
@keyframes fsh{0%{opacity:0;transform:translateX(-55%)}30%{opacity:1}100%{opacity:0;transform:translateX(55%)}}
.e-3d{transition:transform .12s ease-out}
.deck{position:absolute;top:0;left:0;width:100%;height:100%}
.dk{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.14);transition:transform .4s cubic-bezier(.25,1,.5,1),opacity .4s}
.dk img{position:absolute;top:0;left:0;width:100%;height:100%}
.pack{position:absolute;top:-5px;left:-5px;right:-5px;bottom:-5px;z-index:7;border-radius:12px;overflow:hidden;pointer-events:none}
.pb{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:12px;overflow:hidden;background:linear-gradient(103deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.34) 42%,rgba(255,255,255,0) 52%),linear-gradient(157deg,#6a2fb5 0,#c25de6 46%,#6a2fb5 62%,#22103f 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 14px 28px rgba(0,0,0,.3);transition:transform .6s cubic-bezier(.45,0,.55,1),opacity .5s}
.pb:after{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(72deg,rgba(255,120,180,.16) 0 6px,rgba(120,220,255,.16) 6px 12px,rgba(190,255,170,.14) 12px 18px,rgba(255,235,140,.14) 18px 24px);mix-blend-mode:screen;opacity:.35}
.pf{position:absolute;z-index:2;top:17%;left:9%;right:9%;bottom:12%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}
.pe{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 18px rgba(255,255,255,.5);background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95),rgba(255,255,255,.15) 62%,rgba(255,255,255,0) 70%);display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:8px}
.pt{font-size:17px;font-weight:900;font-style:italic;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 14px rgba(255,255,255,.45)}
.ps{margin-top:8px;font-size:10px;padding:3px 9px;border-radius:10px;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.35)}
.pl{position:absolute;top:0;left:0;width:100%;height:17%;border-radius:12px 12px 0 0;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.05)),linear-gradient(157deg,#6a2fb5,#c25de6);box-shadow:inset 0 -1px 0 rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;transform-origin:top center;transition:transform .5s cubic-bezier(.35,.85,.4,1),opacity .4s}
.pl:before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 2px,rgba(0,0,0,.16) 2px 5px);opacity:.55}
.pl:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.9) 0 5px,rgba(255,255,255,0) 5px 10px);opacity:.8}
.ph{width:22px;height:22px;border-radius:50%;background:#eceff4;box-shadow:inset 0 2px 3px rgba(0,0,0,.45);position:relative;z-index:2}
.e-draw.on .pl{transform:translateY(-165%) rotate(-7deg);opacity:0}
.e-draw.on .pb{transform:translateY(114%) rotate(1.5deg);opacity:0;transition-delay:.16s}
.shine{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:16px;z-index:3;pointer-events:none;opacity:0;background:linear-gradient(103deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.7) 50%,rgba(255,255,255,0) 60%)}
.e-draw.on .shine{animation:sw .9s .42s ease-out 1}
@keyframes sw{0%{opacity:0;transform:translateX(-60%)}35%{opacity:1}100%{opacity:0;transform:translateX(60%)}}
#sc{position:absolute;top:0;left:0;width:100%;height:100%;z-index:9;border-radius:16px;cursor:crosshair;touch-action:none}
.pola{position:absolute;top:50%;left:50%;width:54%;height:66%;background:#fff;padding:5% 5% 16%;border-radius:4px;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:12;opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-15deg);pointer-events:none}
.pola i{display:block;width:100%;height:100%;background-size:cover;background-position:center}
.e-camera.on .pola{animation:fl 1.2s cubic-bezier(.25,1,.5,1) forwards}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-20%) scale(.6) rotate(-20deg)}50%{opacity:1;transform:translate(-50%,-55%) scale(1.05) rotate(8deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}}
.flash{position:absolute;top:0;left:0;width:100%;height:100%;background:#fff;opacity:0;pointer-events:none;border-radius:16px;z-index:10}
.e-camera.on .flash{animation:fa .35s ease-out}
@keyframes fa{0%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.card,.pb,.pl,.dk{transition-duration:.01ms}}
</style>
</head>
